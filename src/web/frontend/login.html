<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nightcrow — sign in</title>
<style>
  :root {
    color-scheme: dark;
    /* Amber stands in for the TUI's default accent, which is the terminal's
       own ANSI yellow and therefore has no fixed hex to match exactly. */
    --accent: #d9a441;
    --fg: #e5e5e5;
    --muted: #8a8a8a;
    --line: #303030;
    --bg: #0a0a0a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* No card: the page holds a single field, so there is nothing to separate
     it from. The bare centered form reads closer to the terminal it fronts. */
  form { width: min(19rem, 86vw); }

  .mark { display: block; margin: 0 auto .9rem; }

  h1 {
    margin: 0; text-align: center;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 1rem; font-weight: 500; letter-spacing: .04em; color: var(--fg);
  }
  .sub {
    margin: .3rem 0 1.75rem; text-align: center;
    font-size: .68rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted);
  }

  input {
    width: 100%; padding: .62rem .7rem; margin-bottom: .6rem;
    background: #101010; border: 1px solid var(--line); border-radius: 6px;
    color: var(--fg); font-size: .95rem;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  input::placeholder { color: #6b6b6b; }
  input:hover { border-color: #3d3d3d; }
  input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(217, 164, 65, .14);
  }

  button {
    width: 100%; padding: .62rem; border: 0; border-radius: 6px; cursor: pointer;
    background: var(--fg); color: #0a0a0a; font-weight: 600; font-size: .95rem;
    transition: background .12s ease, transform .06s ease;
  }
  button:hover { background: #fafafa; }
  button:active { transform: translateY(1px); }
  button:focus-visible {
    outline: none; box-shadow: 0 0 0 3px rgba(217, 164, 65, .35);
  }

  .error {
    color: #f87171; font-size: .85rem; margin: 0 0 .75rem; text-align: center;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
  <form method="post" action="/login">
    <svg class="mark" width="42" height="42" viewBox="0 0 42 42" aria-hidden="true" focusable="false">
      <rect x="1.25" y="1.25" width="39.5" height="39.5" rx="10.5"
            fill="none" stroke="#282828" stroke-width="1.5"/>
      <path d="M14 15.5 L20 21 L14 26.5" fill="none" stroke="#d9a441"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="23" y="24.4" width="7.5" height="2.4" rx="1.2" fill="#d9a441"/>
    </svg>
    <h1>nightcrow</h1>
    <p class="sub">web mirror</p>
    <!--ERROR-->
    <label class="sr-only" for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="Password"
           autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
