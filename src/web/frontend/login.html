<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nightcrow — sign in</title>
<link rel="icon" type="image/svg+xml" href="/crow.svg">
<style>
  /* Mirrors the web viewer's login screen (viewer-ui/src/App.tsx `Login`) so
     the two services read as one product. The values below are the viewer's
     Tailwind utilities resolved literally: its `ink` palette, its 14px root —
     which is what its rem-based utilities scale against — and its mono body
     type. Changing anything here without changing it there splits them apart
     again. The mark's tile stays fixed amber: the viewer's follows its runtime
     accent, which the mirror has no picker for. */
  :root {
    color-scheme: dark;
    --accent: #d9a441;
    --ink-950: #0b0b0d;
    --ink-900: #121215;
    --ink-700: #2a2a31;
    --ink-400: #6f6f7d;
    --ink-50: #e6e6ec;
    --removed: #c85f5f;
    --font-mono:
      ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  /* The viewer's density knob: its utilities are rem-based, so the root size
     scales the whole screen at once. */
  html { font-size: 14px; }
  body {
    margin: 0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 1.5rem;
    background: var(--ink-950);
    color: var(--ink-50);
    font-family: var(--font-mono);
    font-size: .85rem;
    line-height: 1.4;
  }
  /* No card: the page holds a single field, so there is nothing to separate
     it from. The bare centered form reads closer to the terminal it fronts. */
  form { width: 17rem; max-width: 86vw; }

  .mark {
    display: block; margin: 0 auto .75rem; width: 2.5rem; height: 2.5rem;
    border-radius: 20.7%; background: var(--accent); overflow: hidden;
  }
  .mark img { display: block; width: 100%; height: 100%; }

  h1 {
    margin: 0; text-align: center;
    font-size: 1.125rem; line-height: 1.75rem;
    font-weight: 500; letter-spacing: .025em; color: var(--ink-50);
  }
  .sub {
    margin: .25rem 0 1.25rem; text-align: center;
    font-size: .62rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink-400);
  }

  input {
    width: 100%; padding: .375rem .625rem; margin-bottom: .5rem;
    background: var(--ink-900); border: 1px solid var(--ink-700);
    border-radius: .375rem;
    color: var(--ink-50); font-family: inherit; font-size: inherit;
  }
  input::placeholder { color: var(--ink-400); }
  input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(217, 164, 65, .15);
  }

  button {
    width: 100%; padding: .375rem; border: 0; border-radius: .375rem;
    cursor: pointer;
    background: var(--ink-50); color: var(--ink-950);
    font-family: inherit; font-size: inherit; font-weight: 600;
  }
  button:hover { background: #fff; }
  button:focus-visible {
    outline: none; box-shadow: 0 0 0 3px rgba(217, 164, 65, .35);
  }

  .error {
    color: var(--removed); margin: 0 0 .625rem; text-align: center;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
  <form method="post" action="/login">
    <span class="mark" aria-hidden="true"><img src="/crow-mono.svg" alt=""></span>
    <h1>nightcrow</h1>
    <p class="sub">web mirror</p>
    <!--ERROR-->
    <label class="sr-only" for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="password"
           autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
