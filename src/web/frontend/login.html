<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nightcrow — sign in</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0a0a0a; color: #e5e5e5;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form {
    background: #171717; border: 1px solid #262626; border-radius: 10px;
    padding: 2rem; width: min(22rem, 90vw); box-sizing: border-box;
  }
  h1 { margin: 0 0 1.25rem; font-size: 1.15rem; font-weight: 600; letter-spacing: .01em; }
  label { display: block; font-size: .8rem; color: #a3a3a3; margin-bottom: .4rem; }
  input {
    width: 100%; box-sizing: border-box; padding: .6rem .7rem; margin-bottom: 1rem;
    background: #0a0a0a; border: 1px solid #404040; border-radius: 6px; color: #e5e5e5;
    font-size: .95rem;
  }
  input:focus { outline: none; border-color: #737373; }
  button {
    width: 100%; padding: .6rem; border: 0; border-radius: 6px; cursor: pointer;
    background: #e5e5e5; color: #0a0a0a; font-weight: 600; font-size: .95rem;
  }
  button:hover { background: #fafafa; }
  .error { color: #f87171; font-size: .85rem; margin: 0 0 1rem; }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>nightcrow</h1>
    <!--ERROR-->
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
