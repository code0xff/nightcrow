<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>nightcrow</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root { color-scheme: dark; --accent: #d9a441; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; flex-direction: column; height: 100vh;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* Wordmark header, matching the login page's mark. Left-aligned rather than
     centered like the login page: this one sits above a dense terminal grid,
     where a centered title reads as a banner instead of app chrome. It also
     gives the grid its top margin, so the terminal can sit flush under it
     instead of floating in the middle of the viewport. */
  #head {
    flex: 0 0 auto; display: flex; align-items: baseline; gap: .5rem;
    padding: .55rem .8rem; background: #0a0a0a; border-bottom: 1px solid #262626;
  }
  #head .mark { align-self: center; flex: 0 0 auto; }
  #head .wordmark {
    font-size: 1rem; font-weight: 500; letter-spacing: .04em; color: #e5e5e5;
  }
  #head .tag {
    font-family: system-ui, sans-serif;
    font-size: .62rem; letter-spacing: .18em; text-transform: uppercase;
    color: #737373;
  }
  /* The stage letterboxes the terminal: horizontally centered, top-aligned.
     The grid size is dictated by the local terminal; the browser scales the
     exact same grid to fit. */
  #stage { position: relative; flex: 1 1 auto; overflow: hidden; background: #000; }
  #term { position: absolute; top: 0; left: 0; }
  #bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: .75rem;
    padding: .3rem .75rem; background: #0a0a0a; border-top: 1px solid #262626;
    color: #a3a3a3; font-size: .78rem; font-family: system-ui, sans-serif;
  }
  #bar .dot { width: .55rem; height: .55rem; border-radius: 50%; background: #737373; }
  #bar.connected .dot { background: #4ade80; }
  #bar.down .dot { background: #f87171; }
  #bar .grow { flex: 1 1 auto; }
  #bar a { color: #a3a3a3; text-decoration: none; }
  #bar a:hover { color: #e5e5e5; }
  /* xterm's IME preview is an unstyled, background-less overlay: it paints the
     in-progress syllable straight over the mirrored cells underneath it, which
     is unreadable on a dense TUI grid. Hide it and show the composition in the
     status bar (#ime) instead.

     It must stay laid out: `updateCompositionElements` measures this element
     with getBoundingClientRect and sizes the IME textarea from the result, so
     `display: none` collapses that textarea to 1x1 and breaks composition
     outright. Drop the paint, keep the box. */
  .xterm .composition-view {
    opacity: 0 !important;
    pointer-events: none !important;
  }
  #bar #ime:empty { display: none; }
  #bar #ime {
    padding: .05rem .4rem; border-radius: 3px;
    background: #1f2937; color: #e5e5e5;
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
</style>
</head>
<body>
  <header id="head">
    <svg class="mark" width="22" height="22" viewBox="0 0 42 42" aria-hidden="true" focusable="false">
      <rect x="1.25" y="1.25" width="39.5" height="39.5" rx="10.5"
            fill="none" stroke="#282828" stroke-width="1.5"/>
      <path d="M14 15.5 L20 21 L14 26.5" fill="none" stroke="#d9a441"
            stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="23" y="24.4" width="7.5" height="2.4" rx="1.2" fill="#d9a441"/>
    </svg>
    <span class="wordmark">nightcrow</span>
    <span class="tag">web mirror</span>
  </header>
  <div id="stage"><div id="term"></div></div>
  <div id="bar">
    <span class="dot"></span>
    <span id="status">connecting…</span>
    <span id="ime"></span>
    <span class="grow"></span>
    <a href="/logout">sign out</a>
  </div>
  <script src="/vendor/xterm.js"></script>
  <script>
  (function () {
    const statusEl = document.getElementById('status');
    const bar = document.getElementById('bar');
    const stage = document.getElementById('stage');
    const wrap = document.getElementById('term');

    const term = new Terminal({
      cols: 80,
      rows: 24,
      fontFamily: '"JetBrains Mono", ui-monospace, monospace',
      fontSize: 14,
      // The server parks the cursor at the end of every frame chunk and hides it
      // (DECTCEM) when the mirrored frame has none, so xterm's native cursor is
      // the mirror's cursor.
      cursorBlink: true,
      // The mirror shows exactly the current grid; there is no client-side
      // scrollback (scrolling is routed to the pane program server-side).
      scrollback: 0,
      // NOTE: `disableStdin` must stay off. It gates xterm's `triggerDataEvent`,
      // which is the only path IME-composed text (Hangul, kana, pinyin) and
      // clipboard pastes take to reach `onData` below. Keydown-driven input is
      // suppressed by the custom key handler instead, so nothing double-sends.
      theme: { background: '#000000', foreground: '#e5e5e5' },
    });
    term.open(wrap);

    let ws = null;
    let reconnectDelay = 500;
    let failures = 0;

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
      }
    }

    // Scale the (fixed-size) grid to fit the stage: centered horizontally, but
    // pinned to the top edge — the header above supplies the breathing room
    // that vertical centering used to, and a grid that shifts down as the
    // window grows is harder to read against than one anchored under the header.
    function fit() {
      const screen = term.element && term.element.querySelector('.xterm-screen');
      if (!screen) return;
      wrap.style.transform = 'none';
      const tw = screen.offsetWidth;
      const th = screen.offsetHeight;
      if (!tw || !th) return;
      const scale = Math.min(stage.clientWidth / tw, stage.clientHeight / th);
      wrap.style.transformOrigin = 'top left';
      wrap.style.transform = 'scale(' + scale + ')';
      wrap.style.left = Math.max(0, (stage.clientWidth - tw * scale) / 2) + 'px';
      wrap.style.top = '0px';
    }
    window.addEventListener('resize', fit);

    function setStatus(text, cls) {
      statusEl.textContent = text;
      bar.className = cls || '';
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + location.host + '/ws');
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        failures = 0;
        reconnectDelay = 500;
        setStatus('connected', 'connected');
      };
      ws.onmessage = (e) => {
        if (typeof e.data === 'string') {
          let msg;
          try { msg = JSON.parse(e.data); } catch (_) { return; }
          if (msg.t === 'resize') {
            term.resize(msg.cols, msg.rows);
            fit();
          }
          return;
        }
        term.write(new Uint8Array(e.data));
      };
      ws.onclose = () => {
        setStatus('disconnected — reconnecting…', 'down');
        failures += 1;
        // After several failures the session has likely expired; reload so the
        // server can redirect us to the login page.
        if (failures >= 6) { location.reload(); return; }
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 5000);
      };
      ws.onerror = () => { try { ws.close(); } catch (_) {} };
    }

    // --- Input capture ---------------------------------------------------

    // Special/ASCII keys go out as structured events so they run through
    // nightcrow's exact key routing (leader, focus jumps, scroll keys). During
    // IME composition (Hangul, etc.) keydown is suppressed and the composed
    // text is delivered on compositionend via onData below.
    term.attachCustomKeyEventHandler((e) => {
      if (e.type !== 'keydown') return false;
      if (e.isComposing || e.keyCode === 229) return false;
      send({
        t: 'key',
        key: e.key,
        ctrl: e.ctrlKey,
        alt: e.altKey,
        shift: e.shiftKey,
        meta: e.metaKey,
      });
      e.preventDefault();
      return false; // xterm must not also process the key
    });

    // The custom handler above consumes every keydown, so onData is left with
    // only the input xterm produces on its own: IME-composed text (delivered at
    // compositionend) and clipboard pastes. Both forward as a paste.
    term.onData((data) => {
      if (data) send({ t: 'paste', data });
    });

    // Echo the in-progress composition into the status bar. xterm's own preview
    // is hidden (see .composition-view above) because it anchors to a cursor
    // position the mirror does not track; this keeps the syllable being composed
    // visible without ever painting over the grid.
    const imeEl = document.getElementById('ime');
    if (term.textarea) {
      const showComposition = (e) => { imeEl.textContent = e.data || ''; };
      term.textarea.addEventListener('compositionstart', showComposition);
      term.textarea.addEventListener('compositionupdate', showComposition);
      term.textarea.addEventListener('compositionend', () => { imeEl.textContent = ''; });
      // A dropped connection cannot deliver the pending syllable; clear the
      // stale preview so it does not linger over a reconnect.
      term.textarea.addEventListener('blur', () => { imeEl.textContent = ''; });
    }

    function mouseButton(button) {
      return button === 2 ? 'right' : button === 1 ? 'middle' : 'left';
    }
    function cellAt(e) {
      const screen = term.element.querySelector('.xterm-screen');
      const rect = screen.getBoundingClientRect();
      const cw = rect.width / term.cols;
      const ch = rect.height / term.rows;
      const col = Math.max(0, Math.min(term.cols - 1, Math.floor((e.clientX - rect.left) / cw)));
      const row = Math.max(0, Math.min(term.rows - 1, Math.floor((e.clientY - rect.top) / ch)));
      return { col, row };
    }

    wrap.addEventListener('mousedown', (e) => {
      const { col, row } = cellAt(e);
      send({ t: 'mouse', kind: 'down', button: mouseButton(e.button), col, row,
             ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey });
    });
    wrap.addEventListener('mouseup', (e) => {
      const { col, row } = cellAt(e);
      send({ t: 'mouse', kind: 'up', button: mouseButton(e.button), col, row });
    });
    wrap.addEventListener('wheel', (e) => {
      const { col, row } = cellAt(e);
      send({ t: 'mouse', kind: 'wheel', dir: e.deltaY < 0 ? 'up' : 'down', col, row });
      e.preventDefault();
    }, { passive: false });
    // Suppress the browser context menu so right-click can reach the pane.
    wrap.addEventListener('contextmenu', (e) => e.preventDefault());

    connect();
  })();
  </script>
</body>
</html>
