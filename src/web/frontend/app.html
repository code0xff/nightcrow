<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>nightcrow</title>
<link rel="icon" type="image/svg+xml" href="/crow.svg">
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  /* Chrome colours are the web viewer's `ink` palette (viewer-ui/src/index.css)
     so the two services read as one product; the terminal stage keeps pure
     black, which is what the mirrored grid paints on. */
  :root {
    color-scheme: dark; --accent: #d9a441;
    --ink-900: #121215;
    --ink-700: #2a2a31;
    --ink-400: #6f6f7d;
    --ink-50: #e6e6ec;
    --added: #4ba36b;
    --removed: #c85f5f;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; flex-direction: column; height: 100vh;
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* Wordmark header, matching the login page's mark. Left-aligned rather than
     centered like the login page: this one sits above a dense terminal grid,
     where a centered title reads as a banner instead of app chrome. It also
     gives the grid its top margin, so the terminal can sit flush under it
     instead of floating in the middle of the viewport.

     Pinned in px, and mirrored px-for-px by the viewer's header (its comment in
     App.tsx says the same in reverse): the viewer runs on a 14px root, so the
     shared branding only lands identically if both sides state absolute sizes. */
  #head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
    padding: 8.8px 12.8px;
    background: var(--ink-900); border-bottom: 1px solid var(--ink-700);
  }
  #head .mark {
    flex: 0 0 auto; width: 22px; height: 22px;
    border-radius: 20.7%; background: var(--accent); overflow: hidden;
  }
  #head .mark img { display: block; width: 100%; height: 100%; }
  #head .wordmark {
    font-size: 16px; font-weight: 500; letter-spacing: .04em; color: var(--ink-50);
  }
  #head .tag {
    font-family: system-ui, sans-serif;
    font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink-400);
  }
  /* The stage letterboxes the terminal: horizontally centered, top-aligned.
     The grid size is dictated by the local terminal; the browser scales the
     exact same grid to fit. */
  #stage { position: relative; flex: 1 1 auto; overflow: hidden; background: #000; }
  #term { position: absolute; top: 0; left: 0; }
  /* The viewer's footer, in the same absolute terms as the header above. */
  #bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10.5px;
    padding: 3.5px 10.5px;
    background: var(--ink-900); border-top: 1px solid var(--ink-700);
    color: var(--ink-400); font-size: 11.9px;
  }
  #bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-400); }
  #bar.connected .dot { background: var(--added); }
  #bar.down .dot { background: var(--removed); }
  #bar .grow { flex: 1 1 auto; }
  #bar a { color: var(--ink-400); text-decoration: none; }
  #bar a:hover { color: var(--ink-50); }
  /* xterm's IME preview is an unstyled, background-less overlay: it paints the
     in-progress syllable straight over the mirrored cells underneath it, which
     is unreadable on a dense TUI grid. Hide it and show the composition in the
     status bar (#ime) instead.

     It must stay laid out: `updateCompositionElements` measures this element
     with getBoundingClientRect and sizes the IME textarea from the result, so
     `display: none` collapses that textarea to 1x1 and breaks composition
     outright. Drop the paint, keep the box. */
  .xterm .composition-view {
    opacity: 0 !important;
    pointer-events: none !important;
  }
  #bar #ime:empty { display: none; }
  #bar #ime {
    padding: .05rem .4rem; border-radius: 3px;
    background: #1f2937; color: #e5e5e5;
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
</style>
</head>
<body>
  <header id="head">
    <span class="mark" aria-hidden="true"><img src="/crow-mono.svg" alt=""></span>
    <span class="wordmark">nightcrow</span>
    <span class="tag">web mirror</span>
  </header>
  <div id="stage"><div id="term"></div></div>
  <div id="bar">
    <span class="dot"></span>
    <span id="status">connecting…</span>
    <span id="ime"></span>
    <span class="grow"></span>
    <a href="/logout">sign out</a>
  </div>
  <script src="/vendor/xterm.js"></script>
  <script>
  (function () {
    const statusEl = document.getElementById('status');
    const bar = document.getElementById('bar');
    const stage = document.getElementById('stage');
    const wrap = document.getElementById('term');

    const term = new Terminal({
      cols: 80,
      rows: 24,
      fontFamily: '"JetBrains Mono", ui-monospace, monospace',
      fontSize: 14,
      // The server parks the cursor at the end of every frame chunk and hides it
      // (DECTCEM) when the mirrored frame has none, so xterm's native cursor is
      // the mirror's cursor.
      cursorBlink: true,
      // The mirror shows exactly the current grid; there is no client-side
      // scrollback (scrolling is routed to the pane program server-side).
      scrollback: 0,
      // NOTE: `disableStdin` must stay off. It gates xterm's `triggerDataEvent`,
      // which is the only path IME-composed text (Hangul, kana, pinyin) and
      // clipboard pastes take to reach `onData` below. Keydown-driven input is
      // suppressed by the custom key handler instead, so nothing double-sends.
      theme: { background: '#000000', foreground: '#e5e5e5' },
    });
    term.open(wrap);

    let ws = null;
    let reconnectDelay = 500;
    let failures = 0;

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
      }
    }

    // Gap between the header's bottom rule and the first grid row. Anchoring the
    // grid to a fixed offset (rather than vertically centering it) keeps it from
    // drifting as the window grows, while still setting it off from the header.
    const GRID_TOP_GAP = 24;

    // Scale the (fixed-size) grid to fit the stage below that gap, centered
    // horizontally.
    function fit() {
      const screen = term.element && term.element.querySelector('.xterm-screen');
      if (!screen) return;
      wrap.style.transform = 'none';
      const tw = screen.offsetWidth;
      const th = screen.offsetHeight;
      if (!tw || !th) return;
      // On a short viewport the gap would eat rows the grid needs, so it is
      // taken out of the available height, never out of the grid itself.
      const avail = Math.max(1, stage.clientHeight - GRID_TOP_GAP);
      const scale = Math.min(stage.clientWidth / tw, avail / th);
      wrap.style.transformOrigin = 'top left';
      wrap.style.transform = 'scale(' + scale + ')';
      wrap.style.left = Math.max(0, (stage.clientWidth - tw * scale) / 2) + 'px';
      wrap.style.top = GRID_TOP_GAP + 'px';
    }
    window.addEventListener('resize', fit);

    function setStatus(text, cls) {
      statusEl.textContent = text;
      bar.className = cls || '';
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(proto + '://' + location.host + '/ws');
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        failures = 0;
        reconnectDelay = 500;
        setStatus('connected', 'connected');
      };
      ws.onmessage = (e) => {
        if (typeof e.data === 'string') {
          let msg;
          try { msg = JSON.parse(e.data); } catch (_) { return; }
          if (msg.t === 'resize') {
            term.resize(msg.cols, msg.rows);
            fit();
          }
          return;
        }
        term.write(new Uint8Array(e.data));
      };
      ws.onclose = () => {
        setStatus('disconnected — reconnecting…', 'down');
        failures += 1;
        // After several failures the session has likely expired; reload so the
        // server can redirect us to the login page.
        if (failures >= 6) { location.reload(); return; }
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 5000);
      };
      ws.onerror = () => { try { ws.close(); } catch (_) {} };
    }

    // --- Input capture ---------------------------------------------------

    // Special/ASCII keys go out as structured events so they run through
    // nightcrow's exact key routing (leader, focus jumps, scroll keys). During
    // IME composition (Hangul, etc.) keydown is suppressed and the composed
    // text is delivered on compositionend via onData below.
    term.attachCustomKeyEventHandler((e) => {
      if (e.type !== 'keydown') return false;
      if (e.isComposing || e.keyCode === 229) return false;
      send({
        t: 'key',
        key: e.key,
        ctrl: e.ctrlKey,
        alt: e.altKey,
        shift: e.shiftKey,
        meta: e.metaKey,
      });
      e.preventDefault();
      return false; // xterm must not also process the key
    });

    // The custom handler above consumes every keydown, so onData is left with
    // only the input xterm produces on its own: IME-composed text (delivered at
    // compositionend) and clipboard pastes. Both forward as a paste.
    term.onData((data) => {
      if (data) send({ t: 'paste', data });
    });

    // Echo the in-progress composition into the status bar. xterm's own preview
    // is hidden (see .composition-view above) because it anchors to a cursor
    // position the mirror does not track; this keeps the syllable being composed
    // visible without ever painting over the grid.
    const imeEl = document.getElementById('ime');
    if (term.textarea) {
      const showComposition = (e) => { imeEl.textContent = e.data || ''; };
      term.textarea.addEventListener('compositionstart', showComposition);
      term.textarea.addEventListener('compositionupdate', showComposition);
      term.textarea.addEventListener('compositionend', () => { imeEl.textContent = ''; });
      // A dropped connection cannot deliver the pending syllable; clear the
      // stale preview so it does not linger over a reconnect.
      term.textarea.addEventListener('blur', () => { imeEl.textContent = ''; });
    }

    function mouseButton(button) {
      return button === 2 ? 'right' : button === 1 ? 'middle' : 'left';
    }
    function cellAt(e) {
      const screen = term.element.querySelector('.xterm-screen');
      const rect = screen.getBoundingClientRect();
      const cw = rect.width / term.cols;
      const ch = rect.height / term.rows;
      const col = Math.max(0, Math.min(term.cols - 1, Math.floor((e.clientX - rect.left) / cw)));
      const row = Math.max(0, Math.min(term.rows - 1, Math.floor((e.clientY - rect.top) / ch)));
      return { col, row };
    }

    // Tracks a press that has not been released yet, so the window-level
    // handler below only reports releases that pair with one of ours.
    let pressedButton = null;
    wrap.addEventListener('mousedown', (e) => {
      pressedButton = mouseButton(e.button);
      const { col, row } = cellAt(e);
      send({ t: 'mouse', kind: 'down', button: pressedButton, col, row,
             ctrl: e.ctrlKey, alt: e.altKey, shift: e.shiftKey });
    });
    // On window, not wrap: a mouseup targets the element the pointer is over,
    // so dragging out of the terminal before releasing would never fire a
    // handler bound to wrap. The program that saw the button-down would then
    // never see the button-up and could sit in a drag or selection state.
    // `cellAt` clamps to the grid, so an outside release lands on the nearest
    // edge cell — the same thing the native side does with the pane rect.
    window.addEventListener('mouseup', (e) => {
      if (pressedButton === null) return;
      const button = pressedButton;
      pressedButton = null;
      const { col, row } = cellAt(e);
      send({ t: 'mouse', kind: 'up', button, col, row });
    });
    wrap.addEventListener('wheel', (e) => {
      const { col, row } = cellAt(e);
      send({ t: 'mouse', kind: 'wheel', dir: e.deltaY < 0 ? 'up' : 'down', col, row });
      e.preventDefault();
    }, { passive: false });
    // Suppress the browser context menu so right-click can reach the pane.
    wrap.addEventListener('contextmenu', (e) => e.preventDefault());

    connect();
  })();
  </script>
</body>
</html>
